name: NxNative - Generic IPA Builder

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Choose the target device and texture support path"
        required: true
        type: choice
        default: "iPhone 15 or older (BC fallback)"
        options:
          - "iPhone 15 or older (BC fallback)"
          - "iPhone 15 Pro/Pro Max or newer (standard)"
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout nxnative source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device == 'iPhone 15 or older (BC fallback)' && 'mianmuhammadse/nxnative' || 'seedds/nxnative' }}
          ref: ${{ inputs.device == 'iPhone 15 or older (BC fallback)' && 'no-bc' || 'main' }}
          path: nxnative

      - name: Verify nxnative checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "Workspace: $GITHUB_WORKSPACE"
          ls -ld "$GITHUB_WORKSPACE/nxnative"
          test -f "$GITHUB_WORKSPACE/nxnative/dm/games/0100D5B026844000/game.tsv" || {
            echo "::error::Expected profile file not found in nxnative checkout: $GITHUB_WORKSPACE/nxnative/dm/games/0100D5B026844000/game.tsv"
            exit 1
          }
          find "$GITHUB_WORKSPACE/nxnative" -name dmsh_chain.py -type f -print -quit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross unar
          python -m pip install --upgrade pip
          python -m pip install \
            lz4 capstone fonttools backports.zstd gdown

      - name: Download game files and keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          download_file() {
            local url="$1"
            local output="$2"
            local file_id

            if [[ -z "${url:-}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi

            file_id="$(python - "$url" <<'PY'
          import re
          import sys
          from urllib.parse import urlparse, parse_qs

          url = sys.argv[1].strip()
          parsed = urlparse(url)
          query = parse_qs(parsed.query)
          file_id = None

          if parsed.netloc.lower() in (
              "drive.google.com",
              "www.drive.google.com",
          ):
              match = re.search(r"/file/d/([^/]+)", parsed.path)
              if match:
                  file_id = match.group(1)
              elif query.get("id"):
                  file_id = query["id"][0]

          if not file_id and re.fullmatch(
              r"[-A-Za-z0-9_]{20,}", url
          ):
              file_id = url

          if not file_id:
              raise SystemExit("Could not extract a Google Drive file ID.")

          print(file_id)
          PY
          )"

            echo "Downloading $(basename "$output")..."
            gdown "$file_id" -O "$output"

            if [[ ! -s "$output" ]]; then
              echo "::error::Downloaded file is empty."
              exit 1
            fi

            file "$output"
          }

          download_file "$GAME_URL" "$WORK/game.download"
          download_file "$KEYS_URL" "$WORK/prod.keys"

          if [[ -n "${UPDATE_URL:-}" ]]; then
            download_file "$UPDATE_URL" "$WORK/update.download"
          else
            echo "No UPDATE_URL configured; continuing without an update."
          fi

          if [[ -n "${DLC_URL:-}" ]]; then
            download_file "$DLC_URL" "$WORK/dlc.download"
          else
            echo "No DLC_URL configured; continuing without DLC."
          fi

          chmod 600 "$WORK/prod.keys"

      - name: Extract RAR archives or accept direct game packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])
          package_extensions = {".nsp", ".xci", ".nsz", ".xcz"}
          rar_signatures = (
              b"Rar!\x1a\x07\x00",
              b"Rar!\x1a\x07\x01\x00",
          )

          def validate_package(path):
              with path.open("rb") as f:
                  magic = f.read(4)
              suffix = path.suffix.lower()
              if suffix in (".nsp", ".nsz") and magic != b"PFS0":
                  raise SystemExit(f"Invalid {suffix} package signature: {path.name}")
              if suffix in (".xci", ".xcz") and magic != b"HEAD":
                  raise SystemExit(f"Invalid {suffix} package signature: {path.name}")

          def add_package(source, label):
              target = game_dir / source.name
              if target.exists():
                  raise SystemExit("Duplicate package filename: " + source.name)
              validate_package(source)
              shutil.copy2(source, target)
              print(f"Added {label}: {target.name} ({target.stat().st_size:,} bytes)")

          def process_download(label):
              source = work / f"{label}.download"
              if not source.exists():
                  print(f"No {label} download; skipping.")
                  return
              with source.open("rb") as f:
                  signature = f.read(8)
              is_rar = any(signature.startswith(magic) for magic in rar_signatures)
              if is_rar:
                  extract_dir = work / f"extracted-{label}"
                  extract_dir.mkdir(parents=True, exist_ok=True)
                  print(f"{label}: RAR archive detected; extracting.")
                  subprocess.run(["unar", "-o", str(extract_dir), str(source)], check=True)
                  packages = sorted(
                      p for p in extract_dir.rglob("*")
                      if p.is_file() and p.suffix.lower() in package_extensions
                  )
                  if not packages:
                      raise SystemExit(f"No NSP/XCI/NSZ/XCZ packages found in the {label} RAR archive.")
                  for package in packages:
                      add_package(package, label)
              else:
                  print(f"{label}: not a RAR archive; checking as a direct package.")
                  if signature[:4] == b"PFS0":
                      extension = ".nsp"
                  elif signature[:4] == b"HEAD":
                      extension = ".xci"
                  else:
                      raise SystemExit(f"{label} is not a recognized RAR archive or direct NSP/XCI package.")
                  target = game_dir / f"{label}{extension}"
                  if target.exists():
                      raise SystemExit(f"Output package already exists: {target.name}")
                  shutil.copy2(source, target)
                  validate_package(target)
                  print(f"Added direct package: {target.name} ({target.stat().st_size:,} bytes)")

          process_download("game")
          process_download("update")
          process_download("dlc")

          packages = sorted(
              p for p in game_dir.iterdir()
              if p.is_file() and p.suffix.lower() in package_extensions
          )
          if not packages:
              raise SystemExit("No game packages were prepared.")

          print("\n=== Prepared game packages ===")
          for package in packages:
              print(f"{package.name}: {package.stat().st_size:,} bytes")
          PY

          test -s "$WORK/prod.keys"

      - name: Detect game title ID and select shader profile
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
